[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "juego-numero"
version = "0.1.0"
description = "Juego web de adivinar el numero"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = [
    "Flask>=3.0",
    "gunicorn==23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
juego-numero = "juego_numero.consola:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
juego_numero = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
markers = [
    "integration: prueba que requiere Docker",
]
