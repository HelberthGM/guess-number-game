services:
  app:
    image: "${IMAGE:-ghcr.io/helberthgm/gestor-tareas}:${TAG:-1.0.1}"
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: "${PORT:-8000}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY es obligatoria}"
      APP_VERSION: "${TAG:-1.0.1}"
      APP_COMMIT: "${APP_COMMIT:-unknown}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/health', timeout=2)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
