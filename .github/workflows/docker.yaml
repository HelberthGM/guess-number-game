name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -m "not integration" -q

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production-render
      url: ${{ vars.RENDER_URL }}
    steps:
      - name: Disparar despliegue en Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "${HOOK}" || { echo "Falta el secreto RENDER_DEPLOY_HOOK"; exit 1; }
          curl -fsS -X POST "${HOOK}&ref=${GITHUB_SHA}" >/dev/null
          echo "Despliegue solicitado para el commit ${GITHUB_SHA::7}"

      - name: Smoke test
        env:
          URL: ${{ vars.RENDER_URL }}
        run: |
          test -n "${URL}" || { echo "Falta la variable RENDER_URL"; exit 1; }
          for intento in $(seq 1 40); do
            version=$(
              curl -fsS --max-time 60 "${URL%/}/version" |
              grep -o '"commit": *"[^"]*"' |
              cut -d'"' -f4 ||
              true
            )
            if [ "${version}" = "${GITHUB_SHA::7}" ]; then
              echo "Render sirve la version ${version}"
              exit 0
            fi
            echo "Intento ${intento}: version actual '${version:-sin respuesta}', esperando..."
            sleep 15
          done
          echo "La nueva version no respondio a tiempo"
          exit 1